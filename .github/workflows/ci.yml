name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install coverage test tool
        run: python -m pip install pytest-cov
      - name: Run backend tests
        working-directory: backend
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key-at-least-32-characters
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest --cov=app --cov-fail-under=89 -q
      - name: Check Python code quality
        run: |
          python -m pip install ruff
          python -m ruff check --config backend/pyproject.toml backend scripts
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: find frontend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run frontend unit tests
        working-directory: frontend
        env:
          TZ: America/Los_Angeles
        run: npm test
